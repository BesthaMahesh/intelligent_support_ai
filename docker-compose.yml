version: '3.8'

services:
  intelligent-support-ai:
    build: .
    container_name: intelligent_support_ai
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=llama-3.3-70b-versatile
      - APP_ENV=production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
